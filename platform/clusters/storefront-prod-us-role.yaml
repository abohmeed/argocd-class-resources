apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storefront-deployer
  namespace: storefront-prod
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storefront-prod-deployer
  namespace: storefront-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storefront-deployer-binding
  namespace: storefront-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: storefront-deployer
subjects:
  - kind: ServiceAccount
    name: storefront-prod-deployer
    namespace: storefront-prod
