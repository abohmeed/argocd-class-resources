apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: storefront-banner-matches
spec:
  args:
    - name: expected-banner
  metrics:
    - name: banner-matches
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: banner-matches
                    image: curlimages/curl:8.11.0
                    command:
                      - sh
                      - -c
                      - |
                        actual=$(curl -s http://storefront-preview.storefront-canary.svc.cluster.local)
                        expected="{{ args.expected-banner }}"
                        echo "expected: $expected"
                        echo "actual:   $actual"
                        test "$actual" = "$expected"
