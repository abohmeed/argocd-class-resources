name: smoke

# The discipline, in one file. Fast on every push, honest every night.
#
# 1. The repo tier ("repo invariants" and "runbook / test drift") runs on EVERY push and pull
#    request. It needs only a checkout, finishes in minutes, and nobody can approve a change to a
#    manifest a lesson shows on read-through alone.
# 2. The cluster suite builds a cluster from nothing and runs every lesson that needs a live
#    Argo CD. It runs NIGHTLY, whether or not anyone touched the repo, so rot from outside it
#    (a point release, a vanished registry, a newly-hit CRD limit) is caught by the pipeline rather
#    than by a student. It also runs on demand (workflow_dispatch). It does NOT run on push or pull
#    request: it takes far longer than a review should wait, and a push-triggered run that is
#    cancelled by the next push proves nothing.
# 3. The cluster suite runs on ONE Argo CD version: v3.5.3, the version the course pins
#    (ARGOCD_PIN in test/versions.env), records on, and commits in bootstrap/install.yaml. A student
#    following the course installs exactly that version, so that is the version CI has to defend.
#    The earlier three-minor matrix tested versions no lesson is recorded on, and its failures
#    (for example "install.yaml does not pin v3.3.14") were artifacts of the matrix, not defects in
#    a lesson. Moving the pin is a course decision; when it moves, versions.env moves with it.
# 4. Every job has a 60-minute ceiling, so a hung step fails loudly instead of holding a runner
#    for six hours.
#
# Decision record: D-342 (2026-10-03).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # nightly, whether or not anything changed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: repo invariants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      # lint_repo.sh parses the bootstrap manifests with `kubectl apply --dry-run=client`, which still
      # resolves kinds through a live API server, and `Application` exists only once Argo CD's CRDs do.
      # Without this the job could never pass, and `cluster` (which needs it) never ran.
      - name: A throwaway k3s with Argo CD's CRDs, for the manifest-parse step
        run: |
          set -euo pipefail
          curl -sfL https://get.k3s.io | sh -
          mkdir -p ~/.kube && sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config && sudo chown "$(id -u):$(id -g)" ~/.kube/config  # a user-owned COPY, as S02 teaches; never chmod the original
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
          export KUBECONFIG=$HOME/.kube/config
          for i in $(seq 1 60); do kubectl get nodes 2>/dev/null | grep -q " Ready " && break; sleep 3; done
          kubectl get nodes | grep -q " Ready " || { kubectl get nodes; echo "node never became Ready"; exit 1; }
          source test/versions.env
          kubectl apply --server-side --force-conflicts -k "https://github.com/argoproj/argo-cd/manifests/crds?ref=${ARGOCD_PIN}"
          # apply returns before discovery serves the new kinds; without this, the ApplicationSet
          # parse raced it and failed "no matches for kind" on some runs and not others.
          # Wait on Argo CD's three CRDs by name, not `crd --all`: k3s keeps creating its own CRDs
          # (traefik, helm) during this step, and one with no status yet fails the whole wait with
          # ".status.conditions accessor error". Retried, since a just-applied CRD can be status-less too.
          argo_crds="crd/applications.argoproj.io crd/applicationsets.argoproj.io crd/appprojects.argoproj.io"
          for i in $(seq 1 30); do
            kubectl wait --for=condition=Established $argo_crds --timeout=10s && break
            sleep 3
          done
          kubectl wait --for=condition=Established $argo_crds --timeout=10s
      - run: ./test/smoke/lint_repo.sh
      # The per-lesson repo tier: every lesson whose claim can be checked from a checkout alone.
      # Cheap enough to run on every PR, which is the point — this is the tier that catches a
      # manifest moving out from under a lesson.
      - run: ./test/smoke/run_all.sh repo

  cluster:
    name: cluster suite (argocd v3.5.3, the course pin)
    needs: lint
    # Nightly and on demand only (see the header). The repo tier above still gates every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install k3s (a cluster built from nothing, every run)
        run: |
          curl -sfL https://get.k3s.io | sh -
          mkdir -p ~/.kube && sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config && sudo chown "$(id -u):$(id -g)" ~/.kube/config  # a user-owned COPY, as S02 teaches; never chmod the original
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Wait for the node
        run: kubectl wait --for=condition=Ready node --all --timeout=180s

      # No version resolution step: the suite runs on ARGOCD_PIN exactly as committed. Fail fast if
      # the pin and the committed install manifest ever disagree, since every lesson assumes both.
      - name: Confirm the course pin (test/versions.env and bootstrap/install.yaml agree)
        run: |
          set -euo pipefail
          source test/versions.env
          echo "Argo CD pin: ${ARGOCD_PIN}"
          grep -q "quay.io/argoproj/argocd:${ARGOCD_PIN}" bootstrap/install.yaml \
            || { echo "bootstrap/install.yaml does not pin ${ARGOCD_PIN}"; exit 1; }

      - run: ./test/smoke/s02_control_plane.sh
      - run: ./test/smoke/s01_northwind.sh

      # The per-lesson cluster tier. Scripts that need a live Argo CD run here; scripts that need
      # a browser, a second repository, a registry, four VMs, or something this runner cannot
      # provide declare themselves and are counted in their own column rather than returning a
      # green they did not earn.
      - name: Per-lesson smoke suite (repo + cluster tiers)
        run: ./test/smoke/run_all.sh cluster

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl -n argocd logs deploy/argocd-repo-server --tail=100 || true
          kubectl -n argocd logs statefulset/argocd-application-controller --tail=100 || true

  runbook-drift:
    name: runbook / test drift
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Every command a lesson shows must exist in that lesson's smoke script
        run: ./test/check_runbook_drift.sh
