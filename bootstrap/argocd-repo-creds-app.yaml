apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-repo-creds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abohmeed/argocd-class-resources.git
    targetRevision: main
    path: platform/argocd-repo-creds
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
