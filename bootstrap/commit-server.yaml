apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: commit-server
    app.kubernetes.io/name: argocd-commit-server
    app.kubernetes.io/part-of: argocd
  name: argocd-commit-server
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: commit-server
    app.kubernetes.io/name: argocd-commit-server
    app.kubernetes.io/part-of: argocd
  name: argocd-commit-server
spec:
  ports:
  - name: server
    port: 8086
    protocol: TCP
    targetPort: 8086
  - name: metrics
    port: 8087
    protocol: TCP
    targetPort: 8087
  selector:
    app.kubernetes.io/name: argocd-commit-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: commit-server
    app.kubernetes.io/name: argocd-commit-server
    app.kubernetes.io/part-of: argocd
  name: argocd-commit-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-commit-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-commit-server
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: argocd-commit-server
              topologyKey: kubernetes.io/hostname
            weight: 100
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: argocd
              topologyKey: kubernetes.io/hostname
            weight: 5
      automountServiceAccountToken: false
      containers:
      - args:
        - /usr/local/bin/argocd-commit-server
        env:
        - name: GRPC_ENABLE_TXT_SERVICE_CONFIG
          valueFrom:
            configMapKeyRef:
              key: commitserver.grpc.enable.txt.service.config
              name: argocd-cmd-params-cm
              optional: true
        - name: ARGOCD_COMMIT_SERVER_LISTEN_ADDRESS
          valueFrom:
            configMapKeyRef:
              key: commitserver.listen.address
              name: argocd-cmd-params-cm
              optional: true
        - name: ARGOCD_COMMIT_SERVER_METRICS_LISTEN_ADDRESS
          valueFrom:
            configMapKeyRef:
              key: commitserver.metrics.listen.address
              name: argocd-cmd-params-cm
              optional: true
        - name: ARGOCD_COMMIT_SERVER_LOGFORMAT
          valueFrom:
            configMapKeyRef:
              key: commitserver.log.format
              name: argocd-cmd-params-cm
              optional: true
        - name: ARGOCD_COMMIT_SERVER_LOGLEVEL
          valueFrom:
            configMapKeyRef:
              key: commitserver.log.level
              name: argocd-cmd-params-cm
              optional: true
        - name: ARGOCD_LOG_FORMAT_TIMESTAMP
          valueFrom:
            configMapKeyRef:
              key: log.format.timestamp
              name: argocd-cmd-params-cm
              optional: true
        image: quay.io/argoproj/argocd:v3.5.3
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz?full=true
            port: 8087
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        name: argocd-commit-server
        ports:
        - containerPort: 8086
        - containerPort: 8087
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8087
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /app/config/ssh
          name: ssh-known-hosts
        - mountPath: /app/config/tls
          name: tls-certs
        - mountPath: /app/config/gpg/source
          name: gpg-keys
        - mountPath: /app/config/gpg/keys
          name: gpg-keyring
        - mountPath: /tmp
          name: tmp
      serviceAccountName: argocd-commit-server
      volumes:
      - configMap:
          name: argocd-ssh-known-hosts-cm
        name: ssh-known-hosts
      - configMap:
          name: argocd-tls-certs-cm
        name: tls-certs
      - configMap:
          name: argocd-gpg-keys-cm
        name: gpg-keys
      - emptyDir: {}
        name: gpg-keyring
      - emptyDir: {}
        name: tmp
      - name: argocd-commit-server-tls
        secret:
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          - key: ca.crt
            path: ca.crt
          optional: true
          secretName: argocd-commit-server-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: commit-server
    app.kubernetes.io/name: argocd-commit-server
    app.kubernetes.io/part-of: argocd
  name: argocd-commit-server-network-policy
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-application-controller
    ports:
    - port: 8086
      protocol: TCP
  - from:
    - namespaceSelector: {}
    ports:
    - port: 8087
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-commit-server
  policyTypes:
  - Ingress
