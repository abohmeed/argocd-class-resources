spec:
  template:
    spec:
      containers:
        - name: envsubst-plugin
          command: ["/var/run/argocd/argocd-cmp-server"]
          image: docker.io/library/nginx:1.30.5-alpine-slim
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: envsubst-plugin-config
              mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: plugin.yaml
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: envsubst-plugin-config
          configMap:
            name: envsubst-plugin-config
