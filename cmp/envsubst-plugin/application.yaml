apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storefront-cmp-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abohmeed/argocd-class-resources.git
    targetRevision: main
    path: cmp/envsubst-plugin
    plugin: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: storefront-cmp-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
