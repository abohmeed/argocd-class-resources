apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: envsubst-plugin
spec:
  version: v1.0
  init:
    command: ["sh", "-c"]
    args:
      - "echo 'envsubst plugin initialized' >&2"
  generate:
    command: ["sh", "-c"]
    args:
      - |
        echo "Generating manifests..."
        DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) envsubst < deployment.yaml.tmpl > deployment.yaml
        cat deployment.yaml
  discover:
    find:
      glob: "./deployment.yaml.tmpl"
