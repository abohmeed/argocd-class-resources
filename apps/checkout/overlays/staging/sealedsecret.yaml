# checkout-staging's own copy of the database credential.
#
# Until the credential is resealed for checkout-staging, this patch changes nothing, and the
# overlay ships the base's SealedSecret, sealed under strict scope for the bare checkout namespace.
# To fix it, reseal the credential for checkout-staging with kubeseal, write the output over this
# file, and commit it. The patch in kustomization.yaml targets the base object by kind and name, so
# the namespace kubeseal writes into the output does not stop it from matching.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: checkout-db
