apiVersion: batch/v1
kind: Job
metadata:
  name: checkout-predelete-backup
  namespace: checkout
  annotations:
    argocd.argoproj.io/hook: PreDelete
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: backup
          image: postgres:18.6
          command:
            - sh
            - -c
            - "pg_dump -h checkout-postgres -U checkout checkout > /backup/checkout-final-$(date +%Y%m%d%H%M%S).sql"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: checkout-db
                  key: password
          volumeMounts:
            - name: backup
              mountPath: /backup
      volumes:
        - name: backup
          hostPath:
            path: /var/backups/checkout
            type: DirectoryOrCreate