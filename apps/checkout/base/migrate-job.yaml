apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-migrate-sql
  namespace: checkout
data:
  001_orders.sql: |
    CREATE TABLE IF NOT EXISTS orders (id serial primary key, created_at timestamptz default now());
---
apiVersion: batch/v1
kind: Job
metadata:
  name: checkout-migrate
  namespace: checkout
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:18.6
          command: ["psql", "-h", "checkout-postgres", "-U", "checkout", "-d", "checkout", "-f", "/sql/001_orders.sql"]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: checkout-db
                  key: password
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: checkout-migrate-sql
