apiVersion: batch/v1
kind: Job
metadata:
  name: checkout-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-creds-that-do-not-exist
      containers:
        - name: migrate
          image: ghcr.io/abohmeed/acd184-hook:1
          command: ["true"]
