apiVersion: batch/v1
kind: Job
metadata:
  name: checkout-backfill
  namespace: checkout
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: backfill
          image: postgres:18.6
          command:
            - psql
            - -h
            - checkout-postgres
            - -U
            - checkout
            - -d
            - checkout
            - -c
            - "SELECT 2;"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: checkout-db
                  key: password
