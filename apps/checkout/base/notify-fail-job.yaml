apiVersion: batch/v1
kind: Job
metadata:
  name: checkout-notify-fail
  namespace: checkout
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: notify
          image: curlimages/curl:8.11.1
          env:
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: checkout-slack-webhook
                  key: url
          command:
            - sh
            - -c
            - |
              echo "POST to Slack: checkout sync FAILED"
              curl -sS -X POST -H "Content-Type: application/json" \
                -d '{"text":"checkout sync FAILED"}' "$SLACK_WEBHOOK_URL"
              echo
