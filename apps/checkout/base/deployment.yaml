apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    app.kubernetes.io/name: checkout
  # No sync-wave annotation: wave 0 is the default, so this lands AFTER the database's wave -1.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
    spec:
      containers:
        - name: checkout
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:5678"
            - "-text=$(BANNER)"
          env:
            - name: BANNER
              valueFrom:
                configMapKeyRef:
                  name: checkout-banner
                  key: banner
            # The credential this whole section exists to protect. In S05 it stops being a
            # committed plaintext Secret and becomes a SealedSecret.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: checkout-db
                  key: password
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
