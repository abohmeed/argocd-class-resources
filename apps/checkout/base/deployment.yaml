apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    app.kubernetes.io/name: checkout
  # No sync-wave annotation: wave 0 is the default, so this lands AFTER the database's wave -1.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
    spec:
      # A start-up check: the pod cannot start while Postgres is unreachable. pg_isready exits
      # non-zero until the database answers, so without sync waves the pod sits in
      # Init:CrashLoopBackOff until the Postgres StatefulSet is Ready. The Service is headless,
      # so its name only resolves once the Postgres pod is Ready.
      initContainers:
        - name: db-check
          image: postgres:18.6
          env:
            - name: DB_HOST
              value: checkout-postgres
            - name: DB_PORT
              value: "5432"
          command: ["sh", "-c"]
          args:
            - 'pg_isready -h "$DB_HOST" -p "$DB_PORT" -U checkout -d checkout -t 2 || { echo "checkout: cannot reach Postgres at $DB_HOST:$DB_PORT, exiting"; exit 1; }'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: checkout
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:5678"
            - "-text=$(BANNER)"
          env:
            - name: BANNER
              valueFrom:
                configMapKeyRef:
                  name: checkout-banner
                  key: banner
            # The credential this whole section exists to protect. In S05 it stops being a
            # committed plaintext Secret and becomes a SealedSecret.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: checkout-db
                  key: password
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
