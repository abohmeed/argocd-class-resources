apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app.kubernetes.io/name: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
    spec:
      containers:
        - name: storefront
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:5678"
            - "-text=$(BANNER)"
          env:
            # Sourced from the ConfigMap as an ENV VAR, deliberately.
            # A mounted ConfigMap key is eventually refreshed by the kubelet; an env var is read
            # once at container start. S01 L04 uses that difference as its closing surprise:
            # edit the ConfigMap, re-apply, and the banner does NOT change until the pod restarts.
            - name: BANNER
              valueFrom:
                configMapKeyRef:
                  name: storefront-banner
                  key: banner
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
