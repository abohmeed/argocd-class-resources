apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storefront-dev
resources:
  - ../../base
# The image tag is pinned per environment. Promotion is a one-line change to this block,
# never a branch merge.
images:
  - name: hashicorp/http-echo
    newName: ghcr.io/abohmeed/argocd-class-app
    newTag: "e433ad1ebd39622d1f54194f8e418a9f20d46f3f"
# replicas comes from the base (1): kustomize's replicas field refuses a Rollout, which the base is from S10 L02 on.
# The app image starts its own server on port 5678, so http-echo's flags are dropped.
patches:
  - target:
      kind: Deployment|Rollout
      name: storefront
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/args
configMapGenerator:
  - name: storefront-banner
    behavior: merge
    literals:
      - "banner=storefront v1: dev"
