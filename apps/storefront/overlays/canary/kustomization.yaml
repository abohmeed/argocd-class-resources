apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storefront-canary
resources:
  - ../../base
  - preview-service.yaml
  - httproute.yaml
patches:
  - target:
      kind: Rollout
      name: storefront
    path: canary-strategy-patch.yaml
images:
  - name: hashicorp/http-echo
    newTag: "1.0.0"
configMapGenerator:
  - name: storefront-banner
    behavior: merge
    literals:
      - "banner=storefront v4: canary"
