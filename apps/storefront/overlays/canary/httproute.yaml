apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: storefront
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - storefront.local
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: storefront
          port: 80
          weight: 100
        - group: ""
          kind: Service
          name: storefront-preview
          port: 80
          weight: 0
      matches:
        - path:
            type: PathPrefix
            value: /
