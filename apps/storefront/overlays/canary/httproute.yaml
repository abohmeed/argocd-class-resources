apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: storefront
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - storefront.local
  rules:
    - backendRefs:
        - name: storefront
          port: 80
          weight: 100
        - name: storefront-preview
          port: 80
          weight: 0