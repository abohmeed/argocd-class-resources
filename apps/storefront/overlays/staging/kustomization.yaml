apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storefront-staging
resources:
  - ../../base
images:
  - name: hashicorp/http-echo
    newTag: "1.0.0"
# kustomize's replicas field refuses a Rollout, which the base is from S10 L02 on, so the count is a patch.
patches:
  - target:
      kind: Deployment|Rollout
      name: storefront
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
configMapGenerator:
  - name: storefront-banner
    behavior: merge
    literals:
      - "banner=storefront v1: staging"