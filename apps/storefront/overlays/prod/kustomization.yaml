apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storefront-prod
resources:
  - ../../base
images:
  - name: hashicorp/http-echo
    newTag: "1.0.0"
replicas:
  - name: storefront
    count: 3
configMapGenerator:
  - name: storefront-banner
    behavior: merge
    literals:
      - "banner=storefront v1: prod"