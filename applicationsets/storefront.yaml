# S08 L12: templatePatch, an exception the template can't express, without forking the template.
#
# This is the lesson's answer key: the production fleet from the Cluster generator lesson (every
# cluster labelled env=production, which is prod-us and staging-eu), plus the one exception the
# lesson adds. On camera the lesson works on a scratch appset.yaml with this same content.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: storefront-prod
  namespace: argocd
spec:
  # Modern templating. The legacy dot-less {{name}} form is a HARD PARSE ERROR on 3.5.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            env: production
  template:
    metadata:
      name: '{{.name}}-storefront'
      # The ApplicationSet controller adds no label of its own (v3.5.3), so the template sets one:
      # kubectl get applications -n argocd -l appset=storefront-prod lists exactly what this generates.
      labels:
        appset: storefront-prod
    spec:
      project: default
      source:
        repoURL: https://github.com/abohmeed/argocd-class-resources.git
        targetRevision: main
        path: apps/storefront/overlays/prod
      destination:
        server: '{{.server}}'
        namespace: storefront-prod
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
  # templatePatch only touches the manifest AFTER it renders: it has no say over which entries
  # the generator produces. It works because goTemplate: true is set above, and it merges as a
  # Kubernetes strategic merge patch, not a JSON Patch, so selfHeal changes and prune, beside it,
  # stays as the template wrote it. The match stays exact (eq on the name): the lesson shows a
  # broader match on the env label silently patching prod-us too.
  #
  # spec.project is NOT supported in a templatePatch (ApplicationSet Template docs, v3.5.3). An
  # exception that needs a different project belongs in the template itself, which is why this
  # exception is an annotation plus selfHeal off, and not a move into another AppProject.
  templatePatch: |
    {{ if eq .name "staging-eu" }}
    metadata:
      annotations:
        monitoring.northwind.io/tier: restricted
    spec:
      syncPolicy:
        automated:
          selfHeal: false
    {{ end }}
