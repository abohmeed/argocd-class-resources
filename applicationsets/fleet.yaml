# S09 L07 — the Cluster generator against a real fleet.
#
# Note what is NOT here: any exclusion of the Argo CD host cluster. None is needed.
# The built-in `in-cluster` destination is synthesised in memory and has no Secret, so it carries
# no `argocd.argoproj.io/secret-type` label — and any selector matching that label therefore
# excludes it automatically. That is documented behaviour, not a trick.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: storefront-fleet
  namespace: argocd
spec:
  # Modern templating. Without this, {{.name}} is not how you address a parameter — and the
  # legacy dot-less {{name}} form is a HARD PARSE ERROR on 3.5, not a silent misrender.
  goTemplate: true
  goTemplateOptions:
    # Default behaviour is to ignore a missing key SILENTLY. This turns a typo into a loud failure.
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'storefront-{{.name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/abohmeed/argocd-class-resources.git
        targetRevision: main
        path: 'apps/storefront/overlays/{{.metadata.labels.env}}'
      destination:
        server: '{{.server}}'
        namespace: 'storefront-{{.metadata.labels.env}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
