# Matrix: a Git generator in directory mode (teams/*) crossed with the Cluster
# generator, so every onboarded team gets an Application on every ready cluster with zero
# hand-written YAML. A new team is a directory and a pull request under teams/, not a ticket.
#
# The generator is scoped to the fleet's ready tier, using the same secret-type/tier idiom the fleet
# section already uses to keep the Argo CD host cluster, and any cluster not yet marked ready,
# out of the Matrix. Widening that selector multiplies every entry this ApplicationSet produces.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: teams-fleet
  namespace: argocd
spec:
  # Modern templating, addressed with a dot everywhere: {{ .git.path.basename }}, {{ .cluster.name }}.
  # The legacy dot-less {{name}} form is a HARD PARSE ERROR on 3.5. It is a trap easy to paste in from
  # an older manifest, and it fails just as loudly here as anywhere else in this course.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # The checkout team subscribes its generated Applications to notifications by annotating them
  # with kubectl. The controller keeps Argo CD notification annotations by default; listing the two
  # here makes that explicit, so a regenerated Application keeps its subscriptions.
  preservedFields:
    annotations:
      - notifications.argoproj.io/subscribe.on-sync-succeeded.slack
      - notifications.argoproj.io/subscribe.on-health-degraded.slack
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/abohmeed/argocd-class-resources.git
              revision: main
              pathParamPrefix: git
              directories:
                - path: teams/*
                - path: teams/_template
                  exclude: true
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  tier: staging
  template:
    metadata:
      name: 'team-{{ .git.path.basename }}-{{ .cluster.name }}'
      # The ApplicationSet controller adds no label of its own (v3.5.3), so the template sets one:
      # kubectl get applications -n argocd -l appset=teams-fleet lists exactly what this generates.
      labels:
        appset: teams-fleet
    spec:
      project: default
      source:
        repoURL: https://github.com/abohmeed/argocd-class-resources.git
        targetRevision: main
        path: 'apps/{{ .git.path.basename }}/overlays/{{ .cluster.metadata.labels.tier }}'
      destination:
        server: '{{ .cluster.server }}'
        namespace: '{{ .git.path.basename }}-{{ .cluster.metadata.labels.tier }}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
